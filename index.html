<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HierEdit: Region-Aware Hierarchical Diffusion for Efficient High-Resolution Editing</title>
<meta name="description" content="HierEdit: Region-Aware Hierarchical Diffusion for Efficient High-Resolution Editing (CVPR 2026).">
<style>
  :root { --fg:#1a1a1a; --muted:#666; --accent:#2a5db0; --bg:#fff; --line:#e5e5e5; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:900px; margin:0 auto; padding:64px 24px 96px; }
  header { text-align:center; margin-bottom:40px; }
  h1 { font-size:2rem; line-height:1.25; margin:0 0 18px; font-weight:700; }
  .authors { font-size:1.1rem; margin:0 0 6px; }
  .venue { color:var(--muted); font-size:1rem; margin:0 0 24px; }
  .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:8px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:999px; text-decoration:none;
    background:var(--fg); color:#fff; font-weight:600; font-size:0.95rem;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:hover { transform:translateY(-1px); opacity:.9; }
  .btn.accent { background:var(--accent); }
  figure { margin:40px 0 0; }
  figure img { width:100%; height:auto; border:1px solid var(--line); border-radius:8px; }
  figcaption { color:var(--muted); font-size:0.9rem; text-align:center; margin-top:12px; }
  footer { text-align:center; color:var(--muted); font-size:0.85rem; margin-top:64px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>HierEdit: Region-Aware Hierarchical Diffusion<br>for Efficient High-Resolution Editing</h1>
      <p class="authors">Yuyao Zhang &nbsp;&middot;&nbsp; Alexander Huang-Menders &nbsp;&middot;&nbsp; Yu-Wing Tai</p>
      <p class="venue">CVPR 2026</p>
      <nav class="links">
        <a class="btn" href="https://github.com/PeterYYZhang/HierEdit">Code</a>
        <a class="btn accent" href="https://peteryyzhang.github.io/ERAG/">Project Page</a>
      </nav>
    </header>

    <figure>
      <img src="HierEdit.png" alt="HierEdit method overview">
      <figcaption>
        HierEdit edits a low-resolution proxy to localize the modified region, then refines only that
        region at the original high resolution with a Local-Window MMDiT &mdash; enabling high-fidelity
        editing up to 4K without dense full-canvas attention.
      </figcaption>
    </figure>

    <footer>
      Code and pretrained checkpoints: <a href="https://github.com/PeterYYZhang/HierEdit">github.com/PeterYYZhang/HierEdit</a>
    </footer>
  </div>
</body>
</html>
